name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        # The GUI tests don't run under headless CI; the solver/persistence
        # tests are pure-Python and platform-independent. Coverage settings
        # (source dirs, GUI omit) live in .coveragerc.
        run: >
          pytest -q
          --cov --cov-report=xml --cov-report=term
          tests/test_models.py tests/test_solver.py tests/test_persistence.py

      - name: Upload coverage to Codecov
        # One upload per commit is enough — pick a single matrix cell so the
        # report isn't overwritten 12 times. Skip on PRs from forks (no token).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
